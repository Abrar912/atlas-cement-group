<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" role="img" aria-label="Cement plant and construction site illustration">
  <!--
    Original artwork created for Atlas Cement Group ERP (2026, Abrar Shirzad).
    Hand-authored geometric illustration: cement silos, a building under
    construction and a tower crane in the project's slate-blue / navy palette.
    No third-party artwork or traced material.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25334F"/>
      <stop offset="0.55" stop-color="#1A2640"/>
      <stop offset="1" stop-color="#10192D"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="1080" height="1620" fill="url(#sky)"/>
  <rect width="1080" height="1260" fill="url(#grid)"/>

  <!-- faint moon -->
  <circle cx="880" cy="180" r="64" fill="#94A3B8" opacity="0.10"/>
  <circle cx="880" cy="180" r="64" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.16"/>

  <!-- distant skyline -->
  <g fill="#16213A">
    <rect x="-20" y="1070" width="150" height="190"/>
    <rect x="140" y="1010" width="110" height="250"/>
    <rect x="262" y="1105" width="96" height="155"/>
    <rect x="852" y="1040" width="120" height="220"/>
    <rect x="985" y="1100" width="115" height="160"/>
  </g>
  <g fill="#94A3B8" opacity="0.10">
    <rect x="158" y="1035" width="14" height="18"/><rect x="186" y="1035" width="14" height="18"/><rect x="214" y="1035" width="14" height="18"/>
    <rect x="158" y="1070" width="14" height="18"/><rect x="186" y="1070" width="14" height="18"/><rect x="214" y="1070" width="14" height="18"/>
    <rect x="870" y="1065" width="14" height="18"/><rect x="898" y="1065" width="14" height="18"/><rect x="926" y="1065" width="14" height="18"/>
    <rect x="870" y="1100" width="14" height="18"/><rect x="898" y="1100" width="14" height="18"/><rect x="926" y="1100" width="14" height="18"/>
  </g>

  <!-- ============ cement silos (left) ============ -->
  <g>
    <!-- silo 1 -->
    <polygon points="120,762 230,762 200,700 150,700" fill="#1E2B47"/>
    <rect x="120" y="762" width="110" height="438" fill="#16213A"/>
    <g stroke="#475569" stroke-width="3" opacity="0.7">
      <line x1="120" y1="862" x2="230" y2="862"/>
      <line x1="120" y1="962" x2="230" y2="962"/>
      <line x1="120" y1="1062" x2="230" y2="1062"/>
    </g>
    <rect x="146" y="716" width="58" height="14" fill="#475569" opacity="0.8"/>
    <g stroke="#10192D" stroke-width="10">
      <line x1="136" y1="1180" x2="128" y2="1260"/>
      <line x1="214" y1="1180" x2="222" y2="1260"/>
    </g>
    <!-- silo 2 -->
    <polygon points="252,802 352,802 325,748 279,748" fill="#1E2B47"/>
    <rect x="252" y="802" width="100" height="398" fill="#141E35"/>
    <g stroke="#475569" stroke-width="3" opacity="0.6">
      <line x1="252" y1="892" x2="352" y2="892"/>
      <line x1="252" y1="992" x2="352" y2="992"/>
      <line x1="252" y1="1092" x2="352" y2="1092"/>
    </g>
    <g stroke="#10192D" stroke-width="9">
      <line x1="266" y1="1180" x2="260" y2="1260"/>
      <line x1="338" y1="1180" x2="344" y2="1260"/>
    </g>
    <!-- conveyor to the building -->
    <line x1="352" y1="790" x2="468" y2="712" stroke="#475569" stroke-width="7"/>
    <line x1="410" y1="752" x2="410" y2="1260" stroke="#10192D" stroke-width="8"/>
    <line x1="392" y1="866" x2="428" y2="796" stroke="#10192D" stroke-width="5"/>
    <line x1="428" y1="866" x2="392" y2="796" stroke="#10192D" stroke-width="5"/>
  </g>

  <!-- ============ building under construction (centre) ============ -->
  <g>
    <!-- elevator core -->
    <rect x="596" y="520" width="92" height="740" fill="#0D1526"/>
    <!-- columns -->
    <g fill="#10192D">
      <rect x="466" y="560" width="13" height="700"/>
      <rect x="546" y="560" width="13" height="700"/>
      <rect x="700" y="560" width="13" height="700"/>
      <rect x="752" y="560" width="13" height="700"/>
    </g>
    <!-- floor slabs -->
    <g fill="#16213A">
      <rect x="452" y="552" width="326" height="17"/>
      <rect x="452" y="652" width="326" height="17"/>
      <rect x="452" y="752" width="326" height="17"/>
      <rect x="452" y="852" width="326" height="17"/>
      <rect x="452" y="952" width="326" height="17"/>
      <rect x="452" y="1052" width="326" height="17"/>
      <rect x="452" y="1152" width="326" height="17"/>
      <rect x="452" y="1244" width="326" height="18"/>
    </g>
    <!-- glazing on lower floors -->
    <g fill="#94A3B8" opacity="0.14">
      <rect x="478" y="575" width="54" height="66"/><rect x="568" y="575" width="54" height="66"/><rect x="720" y="575" width="50" height="66"/>
      <rect x="478" y="675" width="54" height="66"/><rect x="568" y="675" width="54" height="66"/><rect x="720" y="675" width="50" height="66"/>
      <rect x="478" y="775" width="54" height="66"/><rect x="568" y="775" width="54" height="66"/>
      <rect x="478" y="875" width="54" height="66"/>
    </g>
    <!-- rebar on the top slab -->
    <g stroke="#475569" stroke-width="4">
      <line x1="480" y1="552" x2="480" y2="522"/>
      <line x1="520" y1="552" x2="520" y2="522"/>
      <line x1="730" y1="552" x2="730" y2="522"/>
      <line x1="756" y1="552" x2="756" y2="522"/>
    </g>
  </g>

  <!-- ============ tower crane (right) ============ -->
  <g>
    <!-- base -->
    <rect x="818" y="1210" width="74" height="50" fill="#10192D"/>
    <!-- mast -->
    <g stroke="#475569" stroke-width="6">
      <line x1="836" y1="1210" x2="836" y2="300"/>
      <line x1="874" y1="1210" x2="874" y2="300"/>
    </g>
    <g stroke="#3E4E6B" stroke-width="3">
      <line x1="836" y1="1160" x2="874" y2="1112"/>
      <line x1="874" y1="1160" x2="836" y2="1112"/>
      <line x1="836" y1="1060" x2="874" y2="1012"/>
      <line x1="874" y1="1060" x2="836" y2="1012"/>
      <line x1="836" y1="960" x2="874" y2="912"/>
      <line x1="874" y1="960" x2="836" y2="912"/>
      <line x1="836" y1="860" x2="874" y2="812"/>
      <line x1="874" y1="860" x2="836" y2="812"/>
      <line x1="836" y1="760" x2="874" y2="712"/>
      <line x1="874" y1="760" x2="836" y2="712"/>
      <line x1="836" y1="660" x2="874" y2="612"/>
      <line x1="874" y1="660" x2="836" y2="612"/>
      <line x1="836" y1="560" x2="874" y2="512"/>
      <line x1="874" y1="560" x2="836" y2="512"/>
      <line x1="836" y1="460" x2="874" y2="412"/>
      <line x1="874" y1="460" x2="836" y2="412"/>
      <line x1="836" y1="360" x2="874" y2="312"/>
      <line x1="874" y1="360" x2="836" y2="312"/>
    </g>
    <!-- tower apex + tie bars -->
    <polygon points="855,232 836,300 874,300" fill="#475569"/>
    <g stroke="#475569" stroke-width="3">
      <line x1="855" y1="240" x2="300" y2="296"/>
      <line x1="855" y1="240" x2="996" y2="296"/>
    </g>
    <!-- jib -->
    <g stroke="#475569" stroke-width="7">
      <line x1="300" y1="300" x2="996" y2="300"/>
    </g>
    <g stroke="#3E4E6B" stroke-width="3">
      <line x1="340" y1="300" x2="376" y2="268"/><line x1="376" y1="268" x2="412" y2="300"/>
      <line x1="412" y1="300" x2="448" y2="268"/><line x1="448" y1="268" x2="484" y2="300"/>
      <line x1="484" y1="300" x2="520" y2="268"/><line x1="520" y1="268" x2="556" y2="300"/>
      <line x1="556" y1="300" x2="592" y2="268"/><line x1="592" y1="268" x2="628" y2="300"/>
      <line x1="628" y1="300" x2="664" y2="268"/><line x1="664" y1="268" x2="700" y2="300"/>
      <line x1="700" y1="300" x2="736" y2="268"/><line x1="736" y1="268" x2="772" y2="300"/>
      <line x1="772" y1="300" x2="808" y2="268"/><line x1="808" y1="268" x2="844" y2="300"/>
    </g>
    <line x1="300" y1="268" x2="996" y2="268" stroke="#475569" stroke-width="4"/>
    <!-- counterweight + cab -->
    <rect x="962" y="272" width="42" height="52" fill="#334155"/>
    <rect x="812" y="308" width="40" height="32" fill="#64748B"/>
    <!-- trolley, cable, lifted cement bag -->
    <line x1="430" y1="304" x2="430" y2="560" stroke="#475569" stroke-width="3"/>
    <rect x="404" y="560" width="52" height="64" rx="10" fill="#334155"/>
    <rect x="424" y="560" width="12" height="64" fill="#64748B" opacity="0.85"/>
    <rect x="404" y="576" width="52" height="6" fill="#64748B" opacity="0.5"/>
  </g>

  <!-- ============ ground ============ -->
  <rect x="0" y="1260" width="1080" height="360" fill="url(#ground)"/>
  <rect x="0" y="1256" width="1080" height="8" fill="#334155" opacity="0.85"/>
  <g stroke="#1E293B" stroke-width="4" opacity="0.9">
    <line x1="60" y1="1340" x2="240" y2="1340"/>
    <line x1="330" y1="1400" x2="560" y2="1400"/>
    <line x1="640" y1="1330" x2="830" y2="1330"/>
    <line x1="140" y1="1470" x2="420" y2="1470"/>
    <line x1="520" y1="1530" x2="780" y2="1530"/>
  </g>

  <!-- stacked cement bags (foreground) -->
  <g>
    <rect x="66" y="1198" width="140" height="60" rx="14" fill="#334155"/>
    <rect x="126" y="1198" width="16" height="60" fill="#64748B" opacity="0.75"/>
    <rect x="216" y="1198" width="140" height="60" rx="14" fill="#2C3A55"/>
    <rect x="276" y="1198" width="16" height="60" fill="#64748B" opacity="0.75"/>
    <rect x="141" y="1134" width="140" height="60" rx="14" fill="#3A4A69"/>
    <rect x="201" y="1134" width="16" height="60" fill="#94A3B8" opacity="0.7"/>
    <rect x="141" y="1150" width="140" height="6" fill="#94A3B8" opacity="0.35"/>
  </g>
</svg>
